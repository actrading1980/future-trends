  <script>
    document.getElementById('content').innerHTML = marked.parse("VALIDATION_STATUS: UNVALIDATED\nLos scores en este informe no han superado el gate estadístico de Phase 2.\nNo usar para decisiones de tamaño de posición.\n\n# FutureAnalysis Daily Run — 2026-08-12\n\n## 1. Executive Summary\n\nEl ciclo de capex en semiconductores AI sigue acelerando: TSMC (**TSM**) reportó julio +44.7% YoY y elevó guidance 2026 a \"algo por encima de +40%\" en USD, arrastrando a ASML (+3.1% el 11-ago) y confirmando que el cuello de botella sigue siendo capacidad de fabricación, no demanda. Microsoft está negociando con TSMC (**TSM**) capacidad para +300k chips AI propios en 2027, señal de que los hyperscalers están diversificando lejos de NVIDIA. En quantum, D-Wave publicó un breakthrough técnico en gates de dos qubits e IonQ amplió contratos de defensa (DARPA, NRO), mostrando tracción comercial temprana pero aún de nicho. En biotech, la IA generativa diseñando enzimas CRISPR funcionales marca un salto metodológico, ensombrecido por un segundo caso de muerte en un ensayo de edición génica en China que reabre el debate regulatorio. Solid-state batteries siguen en fase de escalado piloto (Sunwoda, 400 Wh/kg) sin comercialización masiva antes de 2027-2030.\n\n## 2. Desarrollos clave del día\n\n**TSMC (**TSM**) julio +44.7% YoY, guidance FY26 elevado a >+40% en USD**\n- **Qué pasó:** TSMC (**TSM**) reportó ventas de julio de NT$467.58bn ($14.5bn), +44.7% interanual, y en su earnings call de agosto elevó su guidance de crecimiento de ingresos 2026 a \"ligeramente por encima de +40%\" en dólares (CNBC, 2026-08-10).\n- **Por qué importa:** Confirma que la demanda de nodos avanzados (3nm/2nm) y empaquetado CoWoS para AI sigue superando la capacidad instalada, sosteniendo pricing power de TSMC (**TSM**) y de sus proveedores de equipos.\n- **Implicación de inversión:** Positivo para TSM, ASML, AMAT, LRCX — todos capturan capex incremental. Negativo relativo para diseñadores fabless sin prioridad de asignación de capacidad (riesgo de cuellos de botella para clientes más pequeños).\n- **Qué vigilar:** Próximo informe mensual de ventas de TSMC (**TSM**) (principios de septiembre 2026) y el detalle de capex 2027 en la call de octubre.\n\n**Microsoft negocia con TSMC (**TSM**) +300k chips AI propios para 2027**\n- **Qué pasó:** Bloomberg (2026-08-10) reporta que Microsoft planea aumentar \"significativamente\" la producción de su próxima generación de chips AI propios (Maia), en conversaciones con TSMC (**TSM**) para asegurar capacidad de fabricación para más de 300,000 unidades con entrega en 2027.\n- **Por qué importa:** Es la señal más concreta hasta ahora de que un hyperscaler de primer nivel busca reducir dependencia de NVIDIA a escala material, no solo simbólica.\n- **Implicación de inversión:** Riesgo moderado a mediano plazo para NVDA en el segmento de inferencia interna de Microsoft; positivo para TSM (foundry) y neutral-positivo para AVGO/MRVL si participan en el diseño ASIC.\n- **Qué vigilar:** Confirmación oficial de Microsoft sobre volúmenes de Maia y timeline de despliegue en Azure (próximos earnings de Microsoft, ~fin oct 2026).\n\n**D-Wave: breakthrough en gate de dos qubits + bookings H1 +1,120% YoY**\n- **Qué pasó:** D-Wave presentó un gate de entrelazamiento rápido y de alta fidelidad para qubits de cavidad dual-rail superconductores, y reportó bookings H1 2026 de $35.5M, +1,120% interanual.\n- **Por qué importa:** Combina avance técnico verificable (gate-model) con tracción comercial temprana real, algo poco común en el sector quantum donde el hype suele superar los ingresos.\n- **Implicación de inversión:** Positivo para IONQ y RGTI por sentimiento sectorial, aunque D-Wave no está en el universo curado; el dato de bookings valida que hay presupuesto empresarial real entrando al sector.\n- **Qué vigilar:** Reporte Q3 2026 de D-Wave e IonQ para confirmar si el ritmo de bookings se sostiene o fue un evento puntual.\n\n**IA generativa diseña enzimas CRISPR funcionales no vistas en la naturaleza**\n- **Qué pasó:** Investigadores usaron modelos de IA para diseñar novo enzimas CRISPR funcionales, ampliando el toolkit más allá de variantes naturales optimizadas.\n- **Por qué importa:** Reduce el tiempo de descubrimiento de nuevas nucleasas con mejor especificidad/tamaño, un cuello de botella histórico para terapias in vivo.\n- **Implicación de inversión:** Positivo a largo plazo (12-18m) para CRSP y BEAM si licencian o adoptan estas herramientas; el efecto en el score de hoy es limitado porque aún es investigación, no un candidato clínico.\n- **Qué vigilar:** Publicación peer-reviewed completa y cualquier acuerdo de licencia con compañías del universo.\n\n**Segunda muerte en ensayo de edición génica en China (HuidaGene, DMD)**\n- **Qué pasó:** STAT News (2026-08-05) reportó un segundo caso de muerte en un ensayo clínico de edición génica en China, esta vez ligado a HuidaGene en un trial de distrofia muscular de Duchenne bajo un marco regulatorio laxo (investigator-led, sin supervisión estatal directa).\n- **Por qué importa:** Reabre el debate sobre transparencia y seguridad en trials chinos de gene editing, con riesgo de contagio reputacional/regulatorio para el sector global si reguladores US/EU endurecen requisitos.\n- **Implicación de inversión:** Riesgo moderado (no cuantificado hoy en score) para CRSP, BEAM, MRNA si la FDA/EMA responden con escrutinio adicional a plataformas de edición génica en general, aunque no hay vínculo directo de negocio con HuidaGene.\n- **Qué vigilar:** Declaraciones de FDA/EMA en las próximas semanas; si HuidaGene detiene el trial formalmente.\n\n## 3. Tendencias emergentes nuevas detectadas hoy\n\n- **Diversificación de silicio de hyperscalers (chips AI propios a escala de >300k unidades/año):** hasta ahora los ASIC internos (Trainium, TPU, Maia) eran complementarios; el volumen reportado por Microsoft para 2027 lo convierte en una tendencia de asignación de capex con impacto medible en foundries y en la cuota de NVIDIA.\n- **IA generativa aplicada a diseño de novo de enzimas CRISPR:** primera vez que se reporta diseño funcional (no solo optimización) de nucleasas vía IA, distinto de la tendencia ya conocida de \"AI para descubrimiento de fármacos\".\n\n## 4. Empresas con score provisional > 70 (BULLISH)\n\n```\nTSM | Taiwan Semiconductor Manufacturing | Sc.:88 | Tendencia: Advanced Semiconductors — Capex Cycle | Int.: +3 (CORE)\n- Tesis: TSMC (**TSM**) es el proveedor exclusivo de nodos 3nm/2nm y CoWoS para casi todos los diseñadores AI fabless; el guidance elevado (>+40% FY26) y julio +44.7% YoY confirman que la demanda supera capacidad instalada, con pricing power intacto.\n- Riesgo principal: concentración geográfica en Taiwán y riesgo geopolítico China-Taiwán sigue siendo el mayor tail risk no reflejado en el score técnico/económico.\n- Próximo catalizador: informe de ventas mensuales de agosto (principios de septiembre 2026) y detalle de capex 2027 en la call de octubre.\n\nASML | ASML Holding | Sc.:82 | Tendencia: Advanced Semiconductors — Capex Cycle | Int.: +3 (CORE)\n- Tesis: única proveedora de litografía EUV/High-NA necesaria para nodos <3nm; el rally del 11-ago (+3.14%) refleja re-rating directo por el guidance de TSMC (**TSM**), dado que cada dólar de capex de foundry pasa por ASML.\n- Riesgo principal: pedidos son \"lumpy\" — un ajuste de capex de un solo cliente grande (TSMC (**TSM**), Samsung, Intel) puede mover el backlog reportado significativamente.\n- Próximo catalizador: actualización de backlog y guidance FY26 en el próximo informe trimestral.\n\nAMD | Advanced Micro Devices | Sc.:80 | Tendencia: Advanced Semiconductors — AI Data Center | Int.: +3 (CORE)\n- Tesis: revenue Q2 +50% YoY a $11.5bn con datacenter más que duplicando por demanda de infraestructura AI; se beneficia tanto del ciclo de capex de foundry como de la demanda directa de aceleradores MI-series.\n- Riesgo principal: sigue siendo el \"segundo proveedor\" frente a NVIDIA en aceleradores de máxima gama; su crecimiento depende de mantener diseños ganadores en próximas generaciones.\n- Próximo catalizador: próximo earnings call (Q3 2026) con actualización de guidance de datacenter.\n\nAMAT | Applied Materials | Sc.:75 | T1(75): Advanced Semiconductors — Capex Cycle + T2(68): Gate-All-Around Transition | Int.: +2 (HIGH)\n- Tesis: proveedor clave de equipos de deposición/etch para gate-all-around y empaquetado avanzado; el ciclo de capex elevado de TSMC (**TSM**) se traduce en pedidos de herramientas de proceso.\n- Riesgo principal: exposición a restricciones de exportación a China, que sigue siendo un mercado relevante de ingresos.\n- Próximo catalizador: guidance de pedidos en el próximo earnings call.\n\nLRCX | Lam Research | Sc.:73 | Tendencia: Advanced Semiconductors — Capex Cycle | Int.: +2 (HIGH)\n- Tesis: líder en etch/deposición para DRAM y lógica avanzada; se beneficia directamente del mismo ciclo de capex que impulsa a AMAT y ASML.\n- Riesgo principal: ciclicidad de memoria (DRAM/NAND) puede generar volatilidad de ingresos independiente del ciclo AI.\n- Próximo catalizador: datos de utilización de fabs de clientes memoria en próximos reportes trimestrales.\n```\n\n## 5. Empresas con score provisional < 30 (BEARISH)\n\nSin novedades hoy. No se identificaron catalizadores materiales negativos (≥2 catalizadores) para ninguna empresa del universo en las últimas 48h. La noticia de la muerte en el ensayo de HuidaGene es relevante para el sector gene-editing pero no constituye un catalizador directo de negocio para CRSP/BEAM (empresa distinta, sin vínculo contractual reportado), por lo que no se asigna score BEARISH hoy — se registra como riesgo cualitativo en la Sección 2.\n\n## 6. Conflictos detectados\n\nSin novedades hoy. Ninguna tendencia analizada presentó dispersión de scores entre analistas > 50 puntos.\n\n## 7. Notas para revisión humana\n\n- El desarrollo \"Microsoft +300k chips AI propios (Maia) para 2027\" es un riesgo direccional para NVDA que no se refleja aún en un score BEARISH porque el impacto sobre >30% de revenue no está confirmado (umbral THREATENED/-2). Revisar si próximos reportes cuantifican el % de capacidad de inferencia interna que Microsoft plantea migrar fuera de NVIDIA.\n- La muerte en el ensayo de HuidaGene (China) es una señal sectorial de riesgo regulatorio para gene editing; no se tradujo en score hoy por falta de vínculo directo con empresas del universo, pero merece seguimiento si FDA/EMA reaccionan.\n- D-Wave (bookings +1,120% YoY) no está en el universo de 51 empresas curadas; se usó como proxy de sentimiento para IONQ/RGTI pero no generó score propio.\n\n---\n\n## Fase 5 — Tabla de scores para persistenciaSCORES_CSV_START\nTICKER,SCORE,SCENARIO,INTENSIDAD\nTSM,88,BULLISH,3\nASML,82,BULLISH,3\nAMD,80,BULLISH,3\nAMAT,75,BULLISH,2\nLRCX,73,BULLISH,2\nNVDA,58,NEUTRAL,2\nMSFT,55,NEUTRAL,1\nIONQ,60,BULLISH,2\nRGTI,58,NEUTRAL,2\nCRSP,50,NEUTRAL,0\nBEAM,50,NEUTRAL,0\nMRNA,48,NEUTRAL,0\nSCORES_CSV_END");

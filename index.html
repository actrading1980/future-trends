    document.getElementById('content').innerHTML = marked.parse("VALIDATION_STATUS: UNVALIDATED\nLos scores en este informe no han superado el gate estadístico de Phase 2.\nNo usar para decisiones de tamaño de posición.\n\n# FutureAnalysis — Informe diario 2026-10-02 (prompt v2, shadow mode)\n\n### 1. Executive Summary\n\n1. El catalizador dominante es Micron (FQ4 FY26, 30-sep). Facturó 54.200 M$ (+379% interanual), guía 61.500 M$ para FQ1-27, sube el capex FY27 y dice que no ve cuándo se equilibrarán la oferta y la demanda de DRAM. La memoria es ya el cuello de botella de la IA.\n2. Ese mismo día Samsung subió el precio del Galaxy S26 por el coste de la memoria (01-oct). Es la primera señal clara de que la inflación de la memoria se traslada a los fabricantes de dispositivos (AAPL y QCOM con exposición negativa).\n3. En EASD 2026, Lilly presentó TRIUMPH-2 de retatrutide (hasta un 20,8% de pérdida de peso en pacientes con DM2) y nuevos datos de Foundayo. LLY es el score más alto del día (80).\n4. La regulación de robotaxis se fragmenta. California firmó la SB 1246 y Minneapolis aprobó por 7-6 exigir un monitor humano en el vehículo. Es fricción regulatoria para GOOG/GOOGL (Waymo) y TSLA, con efecto a partir de 2027-2028.\n5. Hay 10 empresas puntuadas: 2 BULLISH (LLY 80, LRCX 73) y 0 BEARISH. AAPL y QCOM, con intensidad negativa y escenario BEARISH, quedan en 53 por el suelo estructural de la fórmula (ver sección 7).\n\n---\n\n### 2. Desarrollos clave del día\n\n**A. Micron confirma un superciclo de memoria hasta 2028: suben la guía, el capex y los precios de HBM para 2027**\n- **Qué pasó:** Micron publicó sus resultados del FQ4 FY26 el 30-sep (8-K y conference call a las 16:30 ET):\n  - Ingresos de 54.230 M$ (+31% trimestral) y margen bruto del 87%.\n  - Guía para FQ1-27 de 61.500 ± 1.500 M$ y BPA ajustado de 38,15 $.\n  - Capex de unos 11.500 M$ en FQ1 y de unos 25.000 M$ en el primer semestre FY27, con el segundo semestre por encima.\n  - Más del 75% de los envíos de 2027 ya están comprometidos, y la mayor parte del HBM de 2027 está vendido \"a precios mucho más altos que en 2026\".\n  - 32.000 M$ en compromisos de clientes (SCA), sobre todo depósitos en efectivo.\n  - El CEO dijo que no tienen visibilidad de cuándo se reequilibrarán la oferta y la demanda.\n  - Lo corroboran el mismo día Samsung, cuyo EVP de memoria dice que el HBM pasará de cerca del 20% a cerca del 30% de las obleas DRAM en 2027, y TrendForce, que estima el ASP de HBM en +121% para 2027.\n- **Por qué importa:** la restricción de la cadena de IA se ha desplazado de la GPU y CoWoS a la memoria y al espacio de sala limpia. El HBM consume varias veces más oblea por bit, así que cada punto de mezcla hacia HBM4/4E reduce la oferta de DRAM convencional. Eso eleva los precios en toda la cadena: el DRAM medio está en 26 $ a finales de septiembre frente a 13 $ en marzo (DRAMeXchange).\n- **Implicación de inversión:**\n  - Positiva para los fabricantes de equipos con más exposición a DRAM: LRCX (etch/deposición) y, en menor grado, AMAT y ASML (capas EUV en DRAM). El 01-oct, AMAT subió un 3,2-3,5% y LRCX un 1,4-2,5%.\n  - Hay un matiz importante. Micron dice que el aumento del capex va sobre todo a construcción (salas limpias para finales de 2028), no a equipos. Para los fabricantes de equipos, el grueso del flujo de pedidos se retrasa a 2027-2028.\n  - Negativa en el margen para quienes compran memoria como coste: smartphones y PCs (AAPL, QCOM).\n- **Qué vigilar:**\n  - Resultados preliminares de Samsung del 3T (~7-8 oct).\n  - ASML el 14-oct, porque los pedidos de clientes de memoria confirmarían o refutarían que el capex llega a los equipos.\n  - LRCX a finales de octubre, en particular el porcentaje de DRAM en sus ingresos de sistemas.\n  - Si los compromisos SCA de Micron (32.000 M$) siguen creciendo en el FQ1.\n\n**B. Primera traslación visible del coste de memoria al consumidor: Samsung sube el Galaxy S26 (01-oct)**\n- **Qué pasó:** Samsung subió el precio del Galaxy S26 unos 150.000 wones (~105 $) en todas las versiones, citando el coste de la memoria (Seoul Economic Daily, 01-oct). Su división MX tuvo su primera pérdida trimestral en el 2T (700.000 M de wones). Counterpoint estima que la memoria ya es el 43% del coste de fabricación de un smartphone premium, frente al 27% en marzo. El mismo artículo recuerda que Apple subió 100 $ los iPhone 16 y 17 el mes pasado.\n- **Por qué importa:** es el mecanismo de segundo orden del desarrollo A. Si los OEM trasladan el precio, cae la elasticidad de volumen. Si lo absorben, se comprimen los márgenes. En los dos casos los proveedores de SoC para handsets y los OEM premium salen perdiendo en el margen durante 2027.\n- **Implicación de inversión:** AAPL queda en EXPOSED (-1) por margen de hardware y riesgo en el ciclo de renovación del iPhone 18. QCOM queda en EXPOSED (-1) por el volumen de Snapdragon en Android premium y por el AI PC (los portátiles X2 llevan mucha LPDDR5X). Ninguno de los dos efectos amenaza más del 30% del negocio, así que la intensidad se queda en -1.\n- **Qué vigilar:** resultados de Apple (finales de oct/principios de nov), en concreto el margen bruto de productos y su comentario sobre costes de memoria. Resultados de QCOM (principios de nov), en concreto la guía de handsets. Y si otros OEM (Xiaomi, Google Pixel) siguen a Samsung con subidas de precio.\n\n**C. Lilly en EASD 2026: TRIUMPH-2 (retatrutide) y datos de Foundayo refuerzan el liderazgo en incretinas**\n- **Qué pasó:** el 30-sep, en el simposio de EASD en Milán, se presentó el ensayo fase 3 TRIUMPH-2 (1.152 pacientes con obesidad y DM2, publicado en The Lancet el 29-sep):\n  - Pérdida de peso a 80 semanas del 12,7% / 19,1% / 20,8% con 4/9/12 mg (estimando de eficacia), frente al 4,0% con placebo. Con IMC ≥35 llega al 23,4%.\n  - HbA1c de -1,4 a -1,6 puntos.\n  - El 01-oct se presentó el simposio de Foundayo (orforglipron) con la comparación indirecta frente a semaglutida oral 25 mg: +1,5% de pérdida de peso y -0,3 puntos de A1c adicionales.\n  - Lilly mantiene el plan de presentar la solicitud de retatrutide en el 1T 2027 (pharmaphorum).\n  - Antecedente fuera de la ventana: aprobación FDA de Onswik (insulina semanal) el 23-sep.\n- **Por qué importa:** la población con DM2 es la que históricamente pierde menos peso con GLP-1. Un ~21% en ese grupo sitúa a retatrutide por encima de tirzepatida y alarga la vida de la franquicia más allá de la pérdida de exclusividad de la siguiente generación. Foundayo refuerza el flanco oral frente al Wegovy en pastilla de Novo.\n- **Implicación de inversión:** LLY es CORE (+3). Es el único nombre del universo con exposición directa, y el impacto en revenue de la franquicia de incretinas supera ampliamente el 30%. No hay nombres perjudicados dentro del universo (Novo no está incluido).\n- **Qué vigilar:**\n  - La lectura de la cohorte de apnea del sueño de TRIUMPH (pendiente \"pronto\").\n  - Resultados de Lilly del 3T (finales de octubre).\n  - La tolerabilidad. Las discontinuaciones por efectos adversos fueron del 12% (9 mg) y del 8% (12 mg) frente al 5% con placebo, y la disestesia y la hipotensión son nuevas señales a vigilar en la etiqueta.\n\n**D. La regulación de robotaxis se fragmenta: SB 1246 en California y monitor humano obligatorio en Minneapolis**\n- **Qué pasó:**\n  - (1) El gobernador Newsom firmó la SB 1246 del senador Cortese (comunicado del Senado de California del 30-sep por la tarde, hora del Pacífico; TechCrunch, 01-oct). Desde julio de 2028 exige:\n    - conductores remotos con base en EE. UU.;\n    - \"local incident technicians\" en el sitio;\n    - avisos a las jurisdicciones locales en fallos de flota;\n    - multas si un vehículo autónomo bloquea a los servicios de emergencia más de 30 minutos.\n  - (2) El 01-oct, el concejo de Minneapolis aprobó por 7-6 la ordenanza \"Workers Drive Minneapolis\". Exige un monitor humano con licencia en el asiento del conductor, pagado al menos con salario mínimo, a partir de octubre de 2027. El alcalde Frey ha criticado la medida y puede vetarla, y no hay votos para superar el veto (FOX 9, CBS, MPR).\n- **Por qué importa:**\n  - La SB 1246 añade costes operativos (técnicos locales, capacidad de teleoperación) pero no frena el despliegue.\n  - La ordenanza de Minneapolis sería, en la práctica, una prohibición del robotaxi sin conductor y crea un precedente laboral replicable en otras ciudades progresistas.\n  - Ambas cosas sugieren que el TAM de los robotaxis en EE. UU. se abrirá con un mosaico regulatorio local, no de forma uniforme.\n- **Implicación de inversión:**\n  - Ligeramente negativa para la opcionalidad de Waymo (GOOG/GOOGL, MEDIUM +1).\n  - Ligeramente negativa para TSLA, cuyo valor descansa en parte en la narrativa Cybercab. La ley menciona explícitamente a los conductores remotos, y Tesla es la única que declara usar teleoperación directa.\n  - Ambivalente para UBER: un AV más lento protege su red de conductores pero retrasa la monetización de sus alianzas con AV.\n  - Ningún efecto entra en el horizonte operativo antes de octubre de 2027.\n- **Qué vigilar:**\n  - Si el alcalde Frey veta la ordenanza (en los próximos días).\n  - Las directrices del DMV de California sobre tiempos de respuesta.\n  - Las entregas de Tesla del 3T (previstas para hoy, 02-oct; el consenso de la compañía es 461.974 vehículos y 15,9 GWh de almacenamiento).\n  - El evento o los datos de Cybercab.\n\n**E. TSMC (**TSM**) estudia un campus en Texas (no confirmado) y Nvidia ajusta su plan de financiación de 500.000 M$ tras el escepticismo de Wall Street. Ninguno se puntúa hoy.**\n- **Qué pasó:**\n  - Bloomberg (01-oct, 10:24 UTC, con fuentes anónimas) informa que TSMC (**TSM**) estudia un campus con varias fábricas en Texas, de al menos 20.000 M$ cada una. La inversión depende de que se prorrogue el crédito fiscal de manufactura avanzada que expira a fin de año. TSMC (**TSM**) no ha comentado.\n  - Reuters (01-oct) informa que bancos y gestores exigen garantías más fuertes para la plataforma de financiación respaldada por chips de Nvidia (500.000 M$ no comprometidos, con garantía de valor residual de hasta el 25%), y que las operaciones en cartera llevarán protecciones mayores.\n- **Por qué importa:** lo de TSMC (**TSM**) prolongaría el ciclo de capex de equipos en EE. UU. (AMAT, LRCX, ASML). Lo de Nvidia apunta al riesgo de fondo del ciclo: la vida útil económica de las GPU como colateral (3-4 años para la banca frente a ~10 para Nvidia) y la circularidad de la financiación.\n- **Implicación de inversión:** ninguna en score hoy. TSMC (**TSM**) es un informe de fuentes condicionado a una ley, y lo de Nvidia es una noticia de mercado de crédito, no uno de los catalizadores materiales definidos.\n- **Qué vigilar:**\n  - La votación de la prórroga del crédito fiscal 48D (Crapo/Wyden).\n  - Los resultados de TSMC (**TSM**) el 15-oct, con la guía de capex 2027.\n  - La primera operación cerrada de la plataforma de Nvidia y su estructura de garantías.\n\n**Análisis multidimensional de las tendencias puntuadas (Fase 2)**\n\n| Tendencia | Técnico | Económico | Geopolítico | Contrarian | Spread | S_analistas |\n|---|---|---|---|---|---|---|\n| T1 Memoria/HBM: superciclo de oferta | 85 (TRL 9; HBM4 en volumen, HBM4E a finales de 2027) | 85 (márgenes del 87%, TAM creciendo más rápido que el DRAM) | 55 (concentración Corea/Taiwán/Japón, controles de exportación a China, subsidios CHIPS) | 40 (riesgo de pico de ciclo; el capex va a construcción, no a equipos; destrucción de demanda en consumo) | 45 | 66 |\n| T2 Incretinas de nueva generación (LLY) | 85 (fase 3 completada, TRL 8) | 85 (TAM de obesidad + DM2 >100.000 M$, poder de precio) | 60 (presión de precios y acuerdos MFN en EE. UU., buena cobertura en la UE) | 55 (tolerabilidad, discontinuaciones, mucho ya en precio, competencia de Novo y de los orales) | 30 | 71 |\n| T3 Regulación de robotaxis | 75 (Waymo con más de 500.000 viajes/semana en 11 mercados; casos límite sin resolver) | 65 (economía unitaria aún en demostración) | 30 (mosaico local, posibles litigios de preempción, presión sindical) | 45 (el consenso infravalora la fricción local) | 45 | 54 |\n\nNinguna tendencia supera el umbral de conflicto (>50).\n\n---\n\n### 3. Tendencias emergentes nuevas detectadas hoy\n\n*Advertencia: el sistema no tiene contexto de sesiones anteriores (tendencias activas = [] y notas = ninguna, por diseño del régimen v2). Aquí \"nueva\" significa que hoy aparece por primera vez como fenómeno diferenciado, no que se haya comprobado que no se detectó antes.*\n\n**3.1 Cómputo de IA en órbita: de concepto a hardware (Google Project Suncatcher)**\n- El 01-oct se lanzó en el Transporter-18 de SpaceX el primer satélite prototipo, hecho con Planet. Lleva 4 TPU que ejecutan Gemma en ventanas de unos 15 minutos por limitaciones térmicas. Google confirmó contacto y \"operación normal\" (blog de Google y NPR, 01-oct). En las pruebas en tierra (haz de protones en UC Davis), las TPU Trillium aguantaron una dosis de radiación superior a la de 5 años en órbita. En 2027 se lanzarán dos satélites para probar el enlace láser entre ellos.\n- **Evaluación:** TRL 4-5 y fuera del horizonte de 3-18 meses en cuanto a ingresos. Es una señal de que la restricción de energía de los centros de datos está empujando a explorar alternativas extremas. No genera score hoy (GOOGL: no es catalizador material comercial). Seguimiento recomendado.\n\n**3.2 La memoria como inflación de costes para los dispositivos (tendencia derivada de la T1)**\n- Es la primera vez que se observa en datos concretos (Samsung S26 y la cifra de Counterpoint de memoria en el 43% del coste) que el superciclo de memoria afecta al hardware de consumo. Abre una tendencia bajista de segundo orden para OEM y proveedores de SoC móviles y de PC. Se puntúa hoy dentro de la T1 (AAPL y QCOM con -1).\n\n**3.3 Fragmentación regulatoria local del vehículo autónomo**\n- Minneapolis sería la primera ciudad de EE. UU. con monitor humano obligatorio. Si el veto no prospera, otras ciudades pueden copiarla. Se puntúa dentro de la T3.\n\n---\n\n### 4. Empresas con score provisional > 70 (BULLISH)\n\n**LLY | Eli Lilly and Company | Sc.:80 | Tendencia: Incretinas de nueva generación (retatrutide/Foundayo) | Int.: +3 (CORE)**\n- **Tesis:** TRIUMPH-2 muestra una pérdida de peso de alrededor del 21% en la población DM2, la más difícil de tratar, con mejora glucémica y cardiometabólica. Junto con Foundayo, que supera a la semaglutida oral 25 mg en la comparación indirecta, Lilly cubre los segmentos inyectable de alta eficacia y oral. La solicitud de retatrutide en el 1T 2027 cae dentro del horizonte.\n- **Riesgo principal:**\n  - Tolerabilidad: más diarrea y náuseas (hasta un 34% y un 28%), discontinuaciones del 8-12% y nuevas señales de disestesia e hipotensión.\n  - Presión de precios en EE. UU. (acuerdos MFN).\n  - Valoración muy alta (~1.145 $ por acción), con poco margen de error.\n- **Próximo catalizador:** resultados del 3T (finales de octubre), lectura de la cohorte de apnea de TRIUMPH y anuncios de lanzamiento de Onswik.\n\n**LRCX | Lam Research | Sc.:73 | Tendencia: Memoria/HBM — superciclo de oferta | Int.: +2 (HIGH)**\n- **Tesis:** es el fabricante de equipos más ligado a DRAM y NAND (etch y deposición; Corea fue el 20% de las ventas del último trimestre). Micron sube el capex FY27, Samsung reasigna obleas a HBM y el mercado DRAM ofrece sin visibilidad de equilibrio. Todo eso alarga el ciclo de pedidos de memoria hasta 2028.\n- **Riesgo principal:** Micron dijo explícitamente que el aumento del capex es sobre todo construcción y que las salas limpias se equiparán \"según la demanda\". Los pedidos de herramientas pueden llegar más tarde (2027-2028) de lo que descuenta la acción, que sube un 90% en lo que va de año y cotiza a más del doble de su valor GF.\n- **Próximo catalizador:** ASML el 14-oct (pedidos de memoria), TSMC (**TSM**) el 15-oct (capex 2027) y los propios resultados de LRCX a finales de octubre.\n\n---\n\n### 5. Empresas con score provisional < 30 (BEARISH)\n\nSin novedades hoy. Ninguna empresa baja de 30.\n\nDos nombres tienen tesis bajista explícita (escenario BEARISH con intensidad negativa) pero no bajan de 30 por el suelo estructural de la fórmula:\n- AAPL: 53 (T1, -1 EXPOSED). Presión por la inflación del coste de memoria sobre el margen del iPhone y el Mac.\n- QCOM: 53 (T1, -1 EXPOSED). Riesgo de volumen en handsets Android premium y de coste en el AI PC.\n\nCon intensidad -1 y p=0,25, S_escenario = 45. El score no puede bajar de unos 30 ni siquiera con S_analistas y S_hype en cero, y con los valores de hoy da 53. Detalle en la sección 7.\n\n---\n\n### 6. Conflictos detectados\n\nSin novedades hoy. Ninguna tendencia puntuada supera un spread de 50 puntos entre analistas (máximo de hoy: 45 en T1 y T3). Las dos tendencias con 45 están cerca del umbral. En la T1 la tensión está entre la fortaleza técnica y económica (85) y el contrarian (40), por el riesgo de pico de ciclo.\n\nCálculo de los scores compuestos de hoy (Score = 0,30·S_analistas + 0,40·S_escenario + 0,30·S_hype):\n\n| Ticker | Tendencia | S_analistas | Int. | Escenario (p) | S_escenario | S_hype | Score |\n|---|---|---|---|---|---|---|---|\n| LLY | T2 | 71 | +3 | BULLISH (0,75) | 95 | 70 | 80 |\n| LRCX | T1 | 66 | +2 | BULLISH (0,75) | 80 | 70 | 73 |\n| AMAT | T1 | 66 | +1 | BULLISH (0,75) | 65 | 70 | 67 |\n| ASML | T1 | 66 | +1 | BULLISH (0,75) | 65 | 60 | 64 |\n| GOOG | T3 | 54 | +1 | NEUTRAL (0,50) | 60 | 60 | 58 |\n| GOOGL | T3 | 54 | +1 | NEUTRAL (0,50) | 60 | 60 | 58 |\n| TSLA | T3 | 54 | +1 | BEARISH (0,25) | 55 | 60 | 56 |\n| AAPL | T1 | 66 | -1 | BEARISH (0,25) | 45 | 50 | 53 |\n| QCOM | T1 | 66 | -1 | BEARISH (0,25) | 45 | 50 | 53 |\n| UBER | T3 | 54 | 0 | NEUTRAL (0,50) | 50 | 50 | 51 |\n\nNinguna empresa aparece en más de una tendencia hoy, así que la regla de máximo no se aplica. S_hype se estimó de forma cualitativa a partir de la densidad de cobertura en la ventana: +2 para Micron, sus fabricantes de equipos y LLY/EASD; +1 para ASML y los nombres de robotaxis; 0 para AAPL, QCOM y UBER en estas tendencias.\n\n---\n\n### 7. Notas para revisión humana\n\n**7.1 Herramientas del run**\n- El MCP **fetch** falló al conectar (CONNECTION_CLOSED), así que no se consultaron directamente las URLs estructuradas de arXiv, GitHub ni Papers with Code vía MCP.\n- **Brave Search** no está configurado (conocido). Se usaron WebSearch y Exa como búsqueda primaria y secundaria.\n- El MCP **sqlite** falló al conectar. No afecta a la persistencia, porque las inserciones las hace el parser de Python de `run_daily.ps1`.\n- Bloomberg y CNBC devolvieron 403 en WebFetch. Las cifras se verificaron en copias sindicadas y fuentes primarias: Bloomberg Law/BGOV/Business Times para TSMC (**TSM**); el 8-K de Micron vía StockTitan y las transcripciones de Longbridge y Seeking Alpha.\n- Intento manual por curl: la API de arXiv no devolvió entradas (respuesta vacía, posiblemente por límite de peticiones). En GitHub, los repos más destacados creados desde el 25-sep son herramientas de agentes y contenido sin relevancia comercial para el universo. **Fase 1 sin cobertura académica efectiva hoy.** No cambia ningún score.\n- Los conectores Gmail, Google Drive, Google Calendar e Interactive Brokers necesitan autorización desde la configuración de conectores de claude.ai. No se usan en este pipeline.\n\n**7.2 Justificación del umbral de ≥2 catalizadores materiales por tendencia puntuada**\n- **T1 Memoria/HBM:** (1) resultados de Micron con cambio de guía y subida de capex (30-sep, earnings). (2) Samsung sube el precio del Galaxy S26 por el coste de memoria (01-oct). Lo cuento como anuncio corporativo con impacto comercial demostrable: una acción de precio verificable, no un comentario.\n  - Corroboran pero **no cuentan** como catalizador: la estimación de TrendForce (+121% en el ASP de HBM, es investigación) y el comentario del EVP de Samsung sobre el reparto de obleas.\n  - **Hay que revisarlo:** si el humano considera que una subida de precio de un OEM no es un catalizador material, la T1 se queda en 1 catalizador y no pasaría el umbral.\n- **T2 LLY:** (1) presentación del simposio TRIUMPH-2 en EASD el 30-sep a las 08:30 CEST, dentro de la ventana. (2) Simposio de Foundayo y datos de la comparación indirecta en EASD el 01-oct.\n  - El comunicado de TRIUMPH-2 y el artículo en The Lancet son del 29-sep, en el borde de la ventana. Cito como catalizador la presentación, no la publicación.\n  - ACHIEVE-4 (anunciado el 15-sep) y la aprobación de Onswik (23-sep) **no** se cuentan.\n- **T3 Robotaxis:** (1) SB 1246 firmada. El comunicado oficial del senador Cortese tiene fecha de publicación 2026-10-01 01:09 UTC (= 30-sep por la tarde, hora del Pacífico), dentro de la ventana. (2) Votación 7-6 en Minneapolis el 01-oct.\n  - Hay un riesgo de veto que podría anular el catalizador (2). Si Frey veta, revisar la T3.\n\n**7.3 Tendencias por debajo del umbral (evidencia para la hipótesis H2)**\n- **Computación cuántica:** hubo varios anuncios el 01-oct (QCi Dirac-3S, beta del simulador de puertas de D-Wave, demostrador de corrección de errores de IQM/Zurich Instruments con NVIDIA NVQLink, motor de tolerancia a fallos de Classiq). Ninguno afecta a IONQ, RGTI ni IBM. NVDA solo de forma tangencial, como plataforma. 0 catalizadores para empresas del universo.\n- **Energía limpia:**\n  - ENPH: el IQ Meter Collar está aprobado por 80 utilities, con unos 38 millones de clientes (30-sep). Es un único catalizador.\n  - FSLR: la nota de \"guía reafirmada\" viene de una fuente de baja calidad (kalkinemedia) y no encontré corroboración primaria. Una guía reafirmada tampoco cuenta como cambio de guía. Contexto sectorial: las acciones solares caen por la subida de los rendimientos de los bonos.\n- **IA agéntica empresarial:** CRM compra Listen Labs (~2.000 M$, anunciado el martes 29-sep, en el borde de la ventana). Lo de OpenAI \"Dot

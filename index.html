    document.getElementById('content').innerHTML = marked.parse("Informe guardado en `reports/20260918.md` (3.171 palabras, bloque CSV con 37 empresas). Reproduzco el informe completo a continuación.\n\n---\n\n# FutureAnalysis Daily Report — 2026-09-18\n\nVALIDATION_STATUS: UNVALIDATED\nLos scores en este informe no han superado el gate estadístico de Phase 2.\nNo usar para decisiones de tamaño de posición.\n\nNota operativa: los MCP `fetch` y `sqlite` fallaron al conectar y `brave-search` no estaba disponible en esta sesión. Discovery realizado con WebSearch, WebFetch y Exa. S_hype estimado cualitativamente (sin conteo de menciones desde DB).\n\n## 1. Executive Summary\n\n1. La Fed subió tipos 25 pb a 3.75-4.00% (16-sep, voto unánime 12-0) y aun así el Nasdaq rebotó +1.7% el 17-sep liderado por semis: el mercado sigue tratando la infraestructura AI como inmune al coste de capital.\n2. Intel confirmó que solo cubre ~50% de la demanda de CPU de clientes frontier, sumado a conversaciones con SK Hynix para fabricar memoria en EEUU: INTC +7.7%, ARM +8.6%, AMD +6.4%.\n3. Nvidia (Huang) proyecta duplicar ventas de chips en 2027 vs 2026; Dell'Oro reporta capex de datacenter +92% YoY en 2Q26, con la salvedad de que gran parte es inflación de precios de memoria, no capacidad física.\n4. IonQ +9% por método generativo (con NVIDIA/ORNL) para construir circuitos de optimización cuántica con tiempo de generación ~constante; sin clientes de pago, señal especulativa.\n5. Apple estudia volver al mercado de servidores (M8 Ultra, 2029) usando NVLink Fusion de Nvidia: refuerza la tesis de Nvidia como estándar de facto del datacenter incluso sin vender GPUs.\n\n## 2. Desarrollos clave del día\n\n**[Fed sube tipos por primera vez desde 2023 y el capex AI compite con el Tesoro por capital]**\n- **Qué pasó:** El FOMC subió el rango objetivo a 3.75-4.00% el 16-sep, voto 12-0, con proyecciones que apuntan a otra subida este año (CNBC, Reuters). El 10Y cerró en 4.94% el 17-sep tras retroceder 6.8 pb. Goldman (Oppenheimer, 18-sep) publicó que el capex de emisores tech AA creció 65% YoY en 2Q y que los emisores AI son el 44% de los $135B de convertibles emitidos en 2026.\n- **Por qué importa:** Por primera vez el buildout AI se financia en el mercado de bonos (Alphabet tuvo FCF negativo en 2Q26; Oracle FCF -$5.4B con $125B de deuda). Un ciclo de tipos al alza importa riesgo de tipo de interés a un modelo que antes se autofinanciaba. La tesis de Goldman es de \"earnings bubble\", no de valoración: el capex financiado con deuda no convierte en beneficio al ritmo descontado.\n- **Implicación de inversión:** Neutral-positivo a corto para los recolectores de capex (NVDA, TSM, AVGO, AMAT, LRCX) mientras nadie recorte guidance. Negativo marginal para quienes financian con deuda o prepagos (ORCL) y para hyperscalers con FCF comprimido (GOOGL, MSFT, META, AMZN). Aplicamos p=NEUTRAL a ORCL por esta razón.\n- **Qué vigilar:** Reunión de la Fed en octubre (mercado descuenta 53% otra subida). Ronda de resultados de finales de octubre (GOOGL, MSFT, META, AMZN): si un segundo hyperscaler menciona precios de memoria como Amazon, pasa a ser coste sectorial.\n\n**[Intel: demanda de CPU al 50% de cobertura y conversaciones con SK Hynix para fab de memoria en EEUU]**\n- **Qué pasó:** Lip-Bu Tan afirmó que la demanda de CPU de clientes frontier supera con mucho la capacidad, cubriendo ~50%, y que CEOs de grandes tecnológicas piden envíos adicionales directamente (TradingKey, Motley Fool 17-sep). Reportes de que SK Hynix negocia con Intel producir memoria en EEUU (Ohio) por primera vez. Tigress subió PO a $145, Northland a Outperform ($120), Melius habla de $165. Intel y ASML confirmaron que High-NA EUV está en HVM con >1M de obleas procesadas y capas de 18A/Panther Lake igualando o superando EUV convencional. INTC cerró a $108.80 (+7.67%).\n- **Por qué importa:** El cuello de botella del buildout se desplaza de GPU a CPU host y memoria (HBM/DRAM). La IA agéntica genera demanda incremental de cómputo general (Dell'Oro). Intel es el único proveedor x86 con fabs propias en EEUU; un cliente ancla de memoria en Ohio valida la estrategia foundry y la política CHIPS.\n- **Implicación de inversión:** Positivo para INTC (+3 CORE en tendencia Intel turnaround), ASML (High-NA en HVM es prueba de adopción), AMD (simpatía en CPU server, +2). La rotación hacia CPU/memoria diluye marginalmente la narrativa \"todo es GPU\" pero no la contradice.\n- **Qué vigilar:** Confirmación formal del acuerdo SK Hynix (regulación coreana y estadounidense). Resultados Intel 3Q26 (finales de octubre): margen bruto foundry y guidance de capacidad. Primer cliente externo 18A/14A anunciado.\n\n**[Nvidia proyecta 2x ventas de chips en 2027; Dell'Oro reporta capex DC +92% en 2Q26 con inflación de memoria]**\n- **Qué pasó:** Jensen Huang declaró que espera que las ventas de chips de 2027 dupliquen las de 2026, con ingresos acumulados de chips AI que podrían alcanzar $1T. Dell'Oro (16-sep) reportó capex global de datacenter +92% YoY en 2Q26, concentrado en Blackwell Ultra y aceleradores custom de hyperscalers; revenue de semis y componentes DC +182% con precios por bit de DRAM y storage más que duplicados. Citi proyecta capex de memoria +46.5% a $80.4B en 2027. Supercycle: siete constructores AI gastaron $657B en los últimos 4 trimestres; ninguno recortó guidance. Micron +5.5%.\n- **Por qué importa:** Una parte significativa del crecimiento de capex refleja precios más altos, no más capacidad física. Esto transfiere pricing power a fabricantes de memoria y eleva el coste del compute para hyperscalers, comprimiendo el ROI por dólar. Supply constraints (energía, memoria) limitan el ritmo de despliegue, lo que extiende el ciclo pero no lo acelera.\n- **Implicación de inversión:** NVDA STRONG_BULLISH (+3): guidance cualitativa de 2x en 2027 y Rubin en 2H26. TSM +3 (expansión 2nm/3nm en Taiwán, Arizona, Japón; 2nm de 90k a 110k wafers/mes hacia mid-2027). AVGO/MRVL +2 por aceleradores custom y networking. Riesgo para SMCI (márgenes de integrador con BOM inflado).\n- **Qué vigilar:** Resultados de Micron (finales de septiembre) para confirmar la trayectoria de precios de HBM. Ronda de capex de octubre. Cualquier señal de que \"capex sube por precio\" se traduzca en menos unidades para NVDA.\n\n**[Apple considera servidores AI con M8 Ultra usando NVLink Fusion de Nvidia (2029)]**\n- **Qué pasó:** The Information (16-sep) reportó que Apple desarrolla un servidor de inferencia empresarial en configuraciones de 2 y 4 M8 Ultra, evaluando NVLink Fusion para interconexión; proyecto iniciado hace ~1 año con apoyo de John Ternus (ahora CEO). Nada finalizado, no antes de 2029, podría cancelarse. Gurman añade que podría llevar M7 Ultra. Paralelamente Huawei presentó Atlas 960 SuperPoD y anunció Ascend 970/980.\n- **Por qué importa:** Si Apple, con su historial de evitar a Nvidia, adopta NVLink Fusion, Nvidia se convierte en el estándar de facto del datacenter AI independientemente del acelerador. NVLink Fusion ya está licenciado a AWS, Qualcomm, Arm, Marvell, MediaTek, Fujitsu y d-Matrix. También confirma demanda de inferencia on-prem suficiente para atraer a Apple.\n- **Implicación de inversión:** Positivo estructural para NVDA (networking como segundo foso; networking +263% YoY en último trimestre reportado). Positivo marginal para ARM y MRVL (ecosistema NVLink Fusion). Neutral para AAPL a 3-18 meses: horizonte 2029 fuera del marco de predicción; sin cambio de score.\n- **Qué vigilar:** Confirmación oficial de Apple/Nvidia. Anuncios de nuevos licenciatarios de NVLink Fusion en GTC. Adopción de UALink (Apple es miembro) como alternativa abierta.\n\n**[IonQ: circuitos de optimización cuántica generados con ML, con NVIDIA y ORNL]**\n- **Qué pasó:** IonQ reportó (17-sep) un método generativo para producir circuitos de optimización cuántica en colaboración con NVIDIA, Oak Ridge National Laboratory y University of Tennessee, con tiempo de generación aproximadamente constante al crecer el tamaño del problema. IONQ +9% a $40.05; D-Wave +8%, Rigetti +7%, QTUM solo +2%. Contexto: IonQ presentó 9 papers en IEEE Quantum Week (14-sep, 4 Best Paper) y anunció Superion 256 (8-sep, entregas 2027). Alice & Bob y CEA (Francia) anunciaron software híbrido cuántico-HPC con máquina en 2027.\n- **Por qué importa:** El setup clásico de problemas de optimización era un cuello de botella que anulaba la ventaja cuántica. Si el coste de generación deja de escalar con el problema, se abre una vía a aplicaciones híbridas antes de la corrección de errores completa. Pero no hay clientes de pago ni métrica de calidad de solución publicada.\n- **Implicación de inversión:** IONQ +3 CORE con p=BULLISH (no STRONG: sin validación comercial). RGTI +3 con p=NEUTRAL (movimiento por simpatía; su catalizador real es el acuerdo de $100M del Dept. of Commerce del 8-sep, fuera de la ventana 48h). NVDA se beneficia marginalmente vía CUDA-Q, sin cambio de score.\n- **Qué vigilar:** Publicación del paper con benchmarks vs. heurísticas clásicas. Pre-orders de Superion 256. Resultados 3Q26 de IonQ (bookings).\n\n## 3. Tendencias emergentes nuevas detectadas hoy\n\n**Rotación del cuello de botella AI de GPU a CPU host + memoria.** Tres señales independientes en 48h: Intel al 50% de cobertura de demanda CPU, Citi con capex de memoria +46.5% en 2027, Dell'Oro atribuyendo parte del +92% de capex a precios de DRAM/storage. No es un desarrollo de la tendencia \"AI capex\" sino un cambio en quién captura el margen incremental dentro del rack. Implica reevaluar INTC, TXN, ON y ARM al alza y SMCI a la baja. Se abre como tendencia nueva; mantener en seguimiento hasta resultados de Micron.\n\n**Nvidia como estándar de interconexión agnóstico al acelerador (NVLink Fusion).** La noticia de Apple es el primer caso de un fabricante de silicio de primer nivel considerando alquilar el fabric de Nvidia sin comprar sus GPUs. Combinado con la lista de licenciatarios existentes, es una tendencia distinta de \"venta de GPUs\": rentas de plataforma en networking. Se abre como tendencia nueva.\n\n**Google Home abierto a agentes de terceros vía MCP.** Google anunció (17-sep) un servidor MCP para Google Home en early access, permitiendo a ChatGPT, Claude y otros agentes controlar el hogar, en el plan Premium Advanced ($20/mes). Junto con el framework de reporting de desalineamiento de OpenAI (6 incidentes documentados) y el zero-day CVSS 10.0 en Cisco ISE, marca la transición de agentes a superficies físicas con nuevos vectores de riesgo. Tendencia nueva de alcance moderado.\n\n## 4. Empresas con score provisional > 70 (BULLISH)\n\n```\nNVDA | NVIDIA | Sc.:85 | T1(85): AI Infra capex/memoria + T5(74): Robotaxi (Hyperion) | Int.: +3 (CORE)\n- Tesis: Huang proyecta 2x ventas de chips en 2027; Rubin en 2H26; Apple evaluando NVLink Fusion confirma el networking como segundo foso; Lucid-Bolt despliega 25k vehículos sobre Hyperion.\n- Riesgo principal: capex de hyperscalers financiado con deuda en un ciclo de subida de tipos; si el capex \"sube por precio de memoria\", NVDA recibe menos unidades por dólar de guidance.\n- Próximo catalizador: ronda de capex de octubre (GOOGL/MSFT/META/AMZN); resultados Micron (HBM) finales de septiembre.\n```\n\n```\nTSM | Taiwan Semiconductor | Sc.:83 | Tendencia: AI Infra capex/memoria | Int.: +3 (CORE)\n- Tesis: 2nm en producción de volumen, expansión a 110k wafers/mes hacia mid-2027; nuevas fabs 3nm en Taiwán, Arizona y Japón; conversión de líneas 5nm a 3nm. Captura todo el ciclo sin importar quién gane en aceleradores.\n- Riesgo principal: concentración geopolítica en Taiwán y tensiones EEUU-Irán elevando prima de riesgo; High-NA solo desde 2030 vs Intel ya en HVM.\n- Próximo catalizador: ventas mensuales de septiembre (~10-oct) y resultados 3Q26 (mid-octubre) con guidance de capex 2027.\n```\n\n```\nINTC | Intel | Sc.:79 | T2(79): Intel turnaround/foundry + T1(60): AI Infra | Int.: +3 (CORE)\n- Tesis: demanda CPU al 50% de cobertura en clientes frontier; High-NA EUV en HVM con >1M obleas; conversaciones SK Hynix para memoria en Ohio darían cliente ancla a foundry; tres subidas de PO en 48h.\n- Riesgo principal: las conversaciones con SK Hynix son preliminares y requieren aprobación regulatoria en dos países; el \"real win\" foundry está a años; +7.7% en un día con hype alto sugiere sobrerreacción.\n- Próximo catalizador: confirmación formal SK Hynix; resultados 3Q26 (finales de octubre) con margen foundry y primer cliente externo 18A/14A.\n```\n\n```\nAVGO | Broadcom | Sc.:77 | Tendencia: AI Infra capex/memoria | Int.: +2 (HIGH)\n- Tesis: Dell'Oro sitúa el gasto concentrado en Blackwell Ultra y aceleradores custom de hyperscalers; Broadcom es el principal diseñador de XPUs custom y del chip Baltra de Apple (N3P, producción 2H26).\n- Riesgo principal: dependencia de 3-4 clientes hyperscaler; si alguno pausa un programa de ASIC el impacto es discreto y grande.\n- Próximo catalizador: anuncios de nuevos clientes XPU; ronda de capex de octubre.\n```\n\n```\nAMD | Advanced Micro Devices | Sc.:77 | Tendencia: AI Infra capex/memoria | Int.: +2 (HIGH)\n- Tesis: la escasez de CPU server que Intel no puede cubrir se traslada a EPYC; demanda incremental de cómputo general por IA agéntica (Dell'Oro); +6.4% el 17-sep.\n- Riesgo principal: en aceleradores sigue lejos de Nvidia y de los ASIC custom; la subida es simpatía con Intel, no catalizador propio.\n- Próximo catalizador: resultados 3Q26 (principios de noviembre); pedidos MI400.\n```\n\n```\nMRVL | Marvell | Sc.:77 | Tendencia: AI Infra capex/memoria | Int.: +2 (HIGH)\n- Tesis: licenciatario de NVLink Fusion; lanzó con Microsoft y Utimaco Azure Payment HSM v2 (17-sep); networking DC creciendo con el capex; Ciena guía +30% anual 3 años en networking óptico, lectura positiva para el segmento.\n- Riesgo principal: valoración exigente y concentración en un cliente de ASIC custom.\n- Próximo catalizador: nuevos anuncios de licenciatario a ~30% de ventas bajo riesgo de nuevas restricciones; el ciclo WFE 2026 ya descontado.\n- Próximo catalizador: resultados Micron (capex 2027); resultados AMAT FQ4 (noviembre).\n```\n\n```\nLRCX | Lam Research | Sc.:73 | Tendencia: AI Infra capex/memoria | Int.: +2 (HIGH)\n- Tesis: mismo mecanismo que AMAT con mayor exposición a NAND/DRAM etch; precios por bit de storage duplicados incentivan capex de NAND.\n- Riesgo principal: idem AMAT; concentración en clientes de memoria coreanos.\n- Próximo catalizador: resultados FQ1 (finales de octubre).\n```\n\n```\nTSLA | Tesla | Sc.:71 | Tendencia: Robotaxi | Int.: +2 (HIGH)\n- Tesis: Cybercab con pasajeros públicos en Austin desde 4-sep; cobro de viajes en 6 metros; negocio de energía con márgenes récord 5 trimestres y planta de Megapack 3 (50 GWh) en Houston; +2.3% el 17-sep.\n- Riesgo principal: Waymo ya en 14 ciudades con >4,000 vehículos y permiso de 1,000 en Las Vegas; Tesla sigue geofenced y con mayor incidencia; rentabilidad del robotaxi no demostrada por nadie.\n- Próximo catalizador: entregas 3Q26 (principios de octubre); expansión de Cybercab fuera de Austin.\n```\n\n## 5. Empresas con score provisional < 30 (BEARISH)\n\nSin novedades hoy. Ninguna empresa del universo cae por debajo de 30. Las presiones detectadas (ORCL por FCF negativo y deuda, SMCI por BOM inflado, GM por retirada de Cruise, UBER por competencia de Waymo/Tesla en Houston) se reflejan en scores 48-68 con escenario NEUTRAL, no en BEARISH. Ver nota H2 en sección 7.\n\n## 6. Conflictos detectados\n\nSin conflictos formales (ningún spread max-min > 50 puntos).\n\nSpread más alto: Quantum híbrido/optimización, con geopolítico 65 (CHIPS Act $100M a Rigetti, CEA-Alice & Bob) vs contrarian 25 (hype sin clientes, QTUM +2%): spread 40. Vigilar; si el siguiente hito no trae un cliente de pago, el contrarian baja y se dispara el flag.\n\nTensión cualitativa: la tendencia AI Infra tiene técnico 80 y económico 85 pero contrarian 40 por la tesis de \"earnings bubble\" de Goldman y el cambio de financiación a deuda. Spread 45, por debajo del umbral, pero es la tensión más relevante para el inversor.\n\n## 7. Notas para revisión humana\n\n1. **Infraestructura:** MCP `fetch` y `sqlite` no conectaron; `brave-search` no disponible. S_hype es estimación cualitativa; los scores de hoy tienen mayor incertidumbre en el componente 0.30 hype. Recomendable reintentar conexión antes del run del 21-sep.\n2. **H2 (0 BEARISH sistemático) se mantiene:** el umbral de 2 catalizadores filtra señales negativas. Hoy hubo dos catalizadores claramente negativos (Fed hike + Goldman earnings bubble) que afectan a todo el universo pero no se mapean a ninguna \"tendencia tecnológica\", por lo que no producen BEARISH. Propuesta: permitir una pseudo-tendencia \"Macro/coste de capital\" con intensidades negativas para hyperscalers apalancados.\n3. **Quirk de fórmula:** con intensidad negativa, S_escenario es mayor para BEARISH (p=0.25) que para NEUTRAL (p=0.5). Ejemplo: -2 BEARISH = 40, -2 NEUTRAL = 30. La fórmula recompensa etiquetar como BEARISH a empresas amenazadas. Revisar antes del schema de 3 estados (~2026-06-08 pendiente).\n4. **Gene Editing y Clean Energy sin umbral hoy:** Intellia BLA aceptada (7-sep) y Google-Fervo geotérmica (1-sep) están fuera de la ventana 48h. CRSP, BEAM, MRNA, LLY, ENPH, FSLR no scored hoy; sus últimos scores en DB siguen vigentes.\n5. **Apple/NVLink Fusion** está single-sourced (The Information) y a horizonte 2029. Se usó solo como evidencia de la tendencia \"Nvidia como estándar\", no como catalizador de AAPL. Revisar si debe contar como catalizador material según definición.\n6. **INTC 79 con hype 80** tras +7.7% en un día basado en rumor preliminar. Candidato a reversión si SK Hynix no confirma en 2-3 semanas. Marcar para seguimiento activo.\n7. **Riesgo geopolítico no modelado:** Trump evaluando acción militar contra Irán; petróleo cayó el 17-sep por reportes de crudo saudí vía Omán. Afecta TSM (prima Taiwán) y a todo el universo vía tipos. No hay tendencia tecnológica asociada.---\n\nRecap: informe del 18-sep generado y guardado en `reports/20260918.md`. Cinco tendencias superaron el umbral (AI Infra/memoria, Intel turnaround, Quantum híbrido, Robotaxi, Agentes/MCP); Gene Editing y Clean Energy no tuvieron catalizadores en 48h. 12 empresas BULLISH, 0 BEARISH (hipótesis H2 sigue vigente). Los MCP `fetch` y `sqlite` no conectaron y `brave-search` no estaba disponible, así que S_hype es estimación cualitativa. No he hecho commit; el archivo queda sin trackear junto a los reports del 10 al 16.");

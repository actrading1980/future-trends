técnica ya demostrada y roadmap de despliegue firmado, en lugar de dispersarse entre startups tempranas — señal de maduración del mercado de ASICs de inferencia.\n- **Implicación de inversión:** Presión competitiva incremental sobre NVIDIA en el segmento de inferencia pura (no entrenamiento), aunque el efecto de mercado total sigue siendo positivo para el ecosistema de foundries (TSM) y proveedores de interconexión (MRVL, AVGO) que se benefician independientemente de quién diseñe el chip.\n- **Qué vigilar:** Anuncios de clientes/despliegues de Etched en producción durante Q3-Q4 2026; próximas rondas de financiación comparables que confirmen si el ritmo de $4.16B anual se sostiene o se satura.\n\n**NVIDIA integra +40 núcleos RISC-V por GPU en B100/H200; RISC-V gana terreno como ISA de control**\n- **Qué pasó:** Reportes de industria confirman que las GPUs B100 y H200 de NVIDIA contienen cada una más de 40 núcleos RISC-V dedicados a gestión de energía, monitoreo térmico, detección de fallos y seguridad; en paralelo, StarFive y LECARC anunciaron una alianza para co-desarrollar CPUs de servidor RISC-V para la era de IA agéntica.\n- **Por qué importa:** RISC-V se está consolidando como la arquitectura de control de facto dentro del propio silicio de NVIDIA, lo cual reduce dependencia de licencias ARM en funciones auxiliares del chip, aunque no reemplaza el núcleo de cómputo GPU.\n- **Implicación de inversión:** Riesgo estructural de largo plazo para ARM en el segmento de control/embedded dentro de chips AI, mitigado por el hecho de que ARM sigue siendo dominante en CPU de aplicación; positivo indirecto para NVDA (optimización de costos de licencia) y neutral para AVGO/MRVL cuyo negocio de silicio custom no depende del ISA de control.\n- **Qué vigilar:** Anuncios de ARM sobre estrategia de respuesta (pricing, v9 adoption) en su próxima earnings call; adopción de RISC-V en next-gen GPUs de AMD o custom silicon de hyperscalers.\n\n**IBM compromete +$10B a quantum computing elivery ataca uno de los mayores obstáculos técnicos del sector — la administración precisa in vivo sin vectores virales de alto riesgo.\n- **Implicación de inversión:** Positivo para CRSP (validación de pipeline diversificado) y BEAM (se beneficia indirectamente de avances en delivery aplicables a base/prime editing), aunque el raise de $600M implica dilución de accionistas actuales de CRSP en el corto plazo.\n- **Qué vigilar:** Precio de colocación y demanda institucional del raise de CRSP (near-term); publicación completa de los resultados de delivery miniaturizado del NIH en revista revisada por pares.\n\n**BrainChip inicia envíos comerciales de AKD1500 neuromórfico (julio 2026)**\n- **Qué pasó:** BrainChip confirmó disponibilidad comercial y primeros envíos de producción de su procesador neuromórfico AKD1500 en julio 2026.\n- **Por qué importa:** Es uno de los primeros procesadores neuromórficos en alcanzar producción comercial real (no solo demos de laboratorio), relevante para aplicaciones de edge AI de ultra-bajo consumo que compiten con soluciones basadas en MCU tradicionales.\n- **Implicación de inversión:** BrainChip no está en el universo curado, pero el hito valida la categoría neuromórfica como adyacente a jugadores de edge AI del universo (QCOM, TXN, ON) que podrían explorar arquitecturas similares o adquirir IP.\n- **Qué vigilar:** Volumen de pedidos reportado por BrainChip en su próximo trimestre; señales de que QCOM/TXN evalúen arquitecturas neuromórficas propias.\n\n## 3. Tendencias emergentes nuevas detectadas hoy\n\nNinguna tendencia genuinamente nueva detectada — los desarrollos de hoy son continuaciones/aceleraciones de tendencias ya activas (AI chip capex, quantum institucionalización, CRISPR delivery). Sin novedades hoy en cuanto a categorías de tendencia inéditas.\n\n## 4. Empresas con score provisional > 70 (BULLISH)\n\n```\nTSM | TSMC | Sc.:84 | Tendencia: AI Chip Capex & Custom Silicon | Int.: +3 (CORE)\n```\n- Tesis: Foundry central par seños custom en próximos earnings.\n\n```\nRGTI | Rigetti Computing | Sc.:82 | Tendencia: Quantum Computing Institucionalización | Int.: +3 (CORE)\n```\n- Tesis: Socio directo en TangleLab (con HPE y Pittsburgh Supercomputing Center), lo que le da visibilidad institucional concreta más allá del hype de mercado público.\n- Riesgo principal: Escala aún de nicho; ingresos comerciales todavía muy por debajo de la narrativa de mercado.\n- Próximo catalizador: Primeros resultados operativos de TangleLab reportados en próximo earnings.\n\n```\nIBM | IBM Corporation | Sc.:81 | Tendencia: Quantum Computing Institucionalización | Int.: +3 (CORE)\n```\n- Tesis: Compromiso de capital más grande y explícito del sector ($10B/5 años) refuerza su posición de líder de infraestructura quantum a largo plazo.\n- Riesgo principal: El objetivo de tolerancia a fallos a gran escala sigue proyectado para 2029 — horizonte largo relativo al de inversión de 3-18 meses de este sistema.\n- Próximo catalizador: Hitos de reducción de tasa de error lógico reportados en Q4 2026.\n\n```\nMRVL | Marvell Technology | Sc.:81 | Tendencia: AI Chip Capex & Custom Silicon | Int.: +3 (CORE)\n```\n- Tesis: Interconexión óptica y silicio custom son beneficiarios directos del aumento de diversidad de diseñadores de chips AI (más clientes, no solo NVIDIA).\n- Riesgo principal: Márgenes bajo presión por competencia de proveedores de interconexión alternativos.\n- Próximo catalizador: Guidance de próximos earnings sobre pipeline de diseños custom.\n\n```\nCRSP | CRISPR Therapeutics | Sc.:79 | Tendencia: CRISPR Delivery & Pipeline Expansion | Int.: +3 (CORE)\n```\n- Tesis: Raise de $600M financia expansión de pipeline (SyNTase) en paralelo a un breakthrough de delivery in vivo que ataca el mayor obstáculo técnico del sector.\n- Riesgo principal: Dilución de accionistas por la emisión de acciones; ejecución clínica de SyNTase aún en fase preclínica.\n- Próximo catalizador: Precio de colocación del raise y siguientes

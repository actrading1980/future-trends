  <script>
    document.getElementById('content').innerHTML = marked.parse("# FutureAnalysis — Informe Diario 2026-08-17\n\n```\nVALIDATION_STATUS: UNVALIDATED\nLos scores en este informe no han superado el gate estadístico de Phase 2.\nNo usar para decisiones de tamaño de posición.\n```\n\n## 1. Executive Summary\n\nLa temporada de resultados Q2 2026 confirma que el ciclo de capex en IA sigue acelerando: AMD, TSMC (**TSM**) y Super Micro reportaron cifras récord y NVIDIA llega a su print del 26 de agosto con el consenso ya elevado a $94-95bn. El diferencial NVIDIA/AMD frente a China se amplía (NVIDIA excluye China por completo; AMD apenas la nota) mientras Samsung revela que sus exportaciones a China superaron a EE.UU. por primera vez, tensionando la licencia de exportación que vence el 31-dic-2026. En biotech, Intellia y CRISPR Therapeutics (**CRSP**) consolidan el caso comercial de la edición génica in vivo con datos Fase 3 positivos y una aprobación pediátrica de Casgevy. En energía limpia, el almacenamiento en baterías crece 70% anual en EE.UU. pero empieza a chocar con cuellos de botella de interconexión de red. En computación cuántica, Pasqal y OptQC/NTT anuncian hitos técnicos y financiación que sugieren commercialización más cercana pero aún a años vista.\n\n## 2. Desarrollos clave del día\n\n**AMD entra en el diseño de la próxima TPU de Google (v10)**\n- **Qué pasó:** SemiAnalysis reporta (vía Tom's Hardware, 16-ago) que Google ha incorporado a AMD en el desarrollo de su TPU de 10ª generación, posiblemente aportando IP de CPU y empaquetado avanzado para cargas de reinforcement learning.\n- **Por qué importa:** Sería la primera participación real de AMD en un ASIC de IA personalizado para un hyperscaler, validando su tecnología de chiplets/SoIC (heredada de Instinct MI300A) más allá de su propio negocio de GPU.\n- **Implicación de inversión:** Positivo para AMD (nueva línea de ingresos de diseño custom, diversifica más allá de Instinct/EPYC) y mixto para NVIDIA (Google refuerza su vía de silicio propio, reduciendo dependencia estructural a largo plazo). Broadcom, diseñador actual de TPU, queda con exposición ambigua.\n- **Qué vigilar:** Confirmación oficial de Google/AMD (aún no confirmado, solo \"market chatter\"); especificaciones del TPU v10i/v10t en próximos eventos de Google Cloud.\n\n**Rally de semiconductores tras resultados \"blockbuster\" en la cadena de servidores IA**\n- **Qué pasó:** Super Micro (SMCI) reportó EPS 78% por encima del consenso, ingresos de $11.12bn (+93.2% YoY) y backlog de más de $60bn entrando en FY2027; esto impulsó rallies simultáneos en AMD (+1.8%), Intel (+3.3%) y NVIDIA (+3%) el 12-ago.\n- **Por qué importa:** El backlog de SMCI es un indicador adelantado de demanda de racks completos (CPU+GPU+networking), sugiriendo que las estimaciones de ingresos de NVIDIA para Q2 (guía de $91bn) podrían quedarse cortas.\n- **Implicación de inversión:** Refuerza la tesis alcista en toda la cadena de suministro de IA (NVDA, AMD, SMCI, AVGO, TSM, AMAT, LRCX). El consenso ya está subiendo estimaciones antes del print de NVIDIA del 26-ago.\n- **Qué vigilar:** NVIDIA Q2 FY2027 el 26-ago-2026; guía de Q3 (BofA espera $107-108bn vs. consenso $104bn).\n\n**TSMC (**TSM**) acelera capacidad para el nodo A16 y el empaquetado óptico (Nvidia Feynman)**\n- **Qué pasó:** Fuentes de la cadena de suministro (Digitimes, 14-ago) indican que TSMC (**TSM**) está comprimiendo los calendarios de construcción en Chiayi AP7 y Nanya AP8 para soportar el salto de Nvidia a Feynman (2028) con el proceso A16, SoIC 3D, CoWoS-L y CPO (co-packaged optics vía tecnología COUPE).\n- **Por qué importa:** Confirma que TSMC (**TSM**) sigue siendo el cuello de botella crítico —y el principal beneficiario de capex— del roadmap de IA de Nvidia; el ancho de banda por rack pasa de 130TB/s (Blackwell) a >1PB/s (Feynman), lo que exige innovación radical en interconexión óptica.\n- **Implicación de inversión:** Muy positivo para TSM y para proveedores de empaquetado avanzado y óptica (Lumentum, Coherent, en los que Nvidia ya invirtió). AMAT y LRCX se benefician indirectamente de la expansión de capacidad de fabricación.\n- **Qué vigilar:** Ritmo de instalación de equipos en AP7/AP8; anuncios de capacidad CoWoS-L/CPO en el Q3 earnings call de TSMC (**TSM**) (octubre 2026).\n\n**Intellia reporta datos Fase 3 positivos para la primera terapia de edición génica in vivo**\n- **Qué pasó:** Lonvo-z (NTLA-2002) redujo ataques de angioedema hereditario en 87% vs. placebo en el ensayo HAELO (publicado en NEJM), con inicio de BLA rolling ante la FDA; lanzamiento comercial esperado H1 2027 si se aprueba.\n- **Por qué importa:** Sería la primera terapia CRISPR in vivo (no ex vivo) en llegar al mercado, un hito tecnológico que valida la plataforma de edición dirigida al hígado y reduce el riesgo percibido de toda la clase de terapias in vivo, incluyendo el programa nex-z de Intellia/Regeneron para ATTR.\n- **Implicación de inversión:** Aunque Intellia (NTLA) no está en el universo curado, el resultado es una validación de clase de activo positiva para CRSP y BEAM, que también desarrollan edición in vivo. CRISPR Therapeutics (**CRSP**) ya tiene el primer fármaco CRISPR aprobado (Casgevy, ex vivo) y ahora expande el pipeline in vivo (CTX340, CTX460).\n- **Qué vigilar:** Aceptación de la BLA de lonvo-z por la FDA (H2 2026); hallazgo de riesgo genético (alelo HLA C*05:01) vinculado a elevaciones hepáticas en nex-z, que podría requerir ajustes de protocolo en toda la clase in vivo.\n\n**CRISPR Therapeutics (**CRSP**): Casgevy aprobado en niños desde 2 años + expansión de pipeline in vivo**\n- **Qué pasó:** La FDA aprobó Casgevy para niños desde 2 años (vs. 12 años antes) en apenas 53 días desde la presentación; además CRSP inició ensayos Fase 1 para CTX340 (hipertensión refractaria) y CTX460 (deficiencia de alfa-1 antitripsina).\n- **Por qué importa:** Amplía el pool de pacientes elegibles para Casgevy en ~5,500 pacientes adicionales y demuestra velocidad regulatoria favorable para terapias génicas raras; el pipeline in vivo diversifica el riesgo de CRSP más allá de una sola indicación.\n- **Implicación de inversión:** Catalizador incremental positivo para CRSP; ingresos por colaboración (royalties de Vertex por Casgevy) deberían acelerar con la ampliación etaria.\n- **Qué vigilar:** Datos de CTX310 (ANGPTL3) en el congreso ESC el 28-ago-2026; lectura de Fase 1b de CTX310 en H2 2026.\n\n## 3. Tendencias emergentes nuevas detectadas hoy\n\n- **Co-packaged optics (CPO) como cuello de botella de próxima generación en IA:** el salto de ancho de banda de Nvidia hacia 1PB/s por rack en Feynman (2028) obliga a mover la conversión óptico-eléctrica dentro del propio empaquetado del chip (tecnología COUPE de TSMC (**TSM**)). Es un desarrollo de la tendencia de semiconductores avanzados, pero con un nuevo eje de inversión (óptica integrada) que no estaba explícito en trimestres anteriores — se marca como emergente por el salto cualitativo en la hoja de ruta, no solo incremental.\n- **Silicio custom para hyperscalers como nueva vía de crecimiento para fabricantes de CPU/GPU tradicionales:** la incorporación de AMD al diseño de TPU de Google (si se confirma) rompe el patrón histórico donde el silicio custom de hyperscaler era terreno exclusivo de Broadcom/Marvell. Podría anunciar una tendencia más amplia de \"diseño abierto\" de ASICs de IA.\n\n## 4. Empresas con score provisional > 70 (BULLISH)\n\n```\nNVDA | NVIDIA Corporation | Sc.:90 | Tendencia: AI Compute/Data Center Buildout | Int.: +3 (CORE)\n- Tesis: Backlog de la cadena de suministro (SMCI +93% YoY, TSMC (**TSM**) acelerando A16/CPO) apunta a que la guía de $91bn para Q2 podría superarse; Vera Rubin entra en producción en H2 2026.\n- Riesgo principal: Exclusión total de ingresos de China en la guía; concentración de crecimiento en financiación de neoclouds ($500bn de estructura de financiación con bancos de Wall Street) que podría enmascarar demanda orgánica real.\n- Próximo catalizador: Resultados Q2 FY2027 el 26-ago-2026, con consenso ya elevado a $94-95bn (BofA).\n\nAMD | Advanced Micro Devices | Sc.:88 | Tendencia: AI Compute/Data Center Buildout | Int.: +3 (CORE)\n- Tesis: Data Center revenue +107% YoY a $6.72bn (58% del total); Helios (primer sistema rack-scale) comienza a enviarse este trimestre a Meta, OpenAI y Oracle; posible entrada en diseño de TPU custom de Google.\n- Riesgo principal: Valoración estirada (P/E ~182x) muy por encima de NVIDIA (P/E ~45x); acción cayó 6.86% tras el reporte pese a superar expectativas, señal de que el mercado exige ejecución perfecta en Helios.\n- Próximo catalizador: Ramp de envíos de Helios en Q4 2026 y 2027; compromiso de Anthropic de hasta 2GW de MI450.\n\nTSM | TSMC | Sc.:87 | Tendencia: AI Compute/Data Center Buildout | Int.: +3 (CORE)\n- Tesis: Ingresos Q2 de $40.2bn (guía Q3 de $44.6-45.8bn), margen bruto 67.7%; aceleración de capacidad en A16, SoIC, CoWoS-L y CPO para soportar el roadmap Blackwell→Rubin→Feynman de Nvidia.\n- Riesgo principal: Concentración de cliente (>70% de ingresos ligados a clientes de EE.UU., principalmente Nvidia); riesgo geopolítico Taiwán sin cambios pero estructural.\n- Próximo catalizador: Q3 2026 earnings call (octubre) con detalle de capacidad CoWoS-L/CPO.\n\nSMCI | Super Micro Computer | Sc.:86 | Tendencia: AI Compute/Data Center Buildout | Int.: +3 (CORE)\n- Tesis: EPS 78% por encima de consenso, ingresos +93.2% YoY, backlog >$60bn entrando en FY2027; guía FY2027 de $65-72bn.\n- Riesgo principal: Márgenes GAAP aún bajos (17.5%) frente a competidores; historial de problemas de gobernanza/contabilidad en 2024 que mantiene cierta prima de riesgo.\n- Próximo catalizador: Conversión de backlog en ingresos reconocidos durante FY2027; próximos resultados trimestrales.\n\nAVGO | Broadcom Inc. | Sc.:78 | Tendencia: AI Compute/Data Center Buildout | Int.: +2 (HIGH)\n- Tesis: Diseñador incumbente de TPUs para Google; expansión de la demanda de ASICs custom de IA en todo el sector de hyperscalers refuerza su segmento XPU.\n- Riesgo principal: Entrada de AMD como potencial co-diseñador en la próxima generación de TPU introduce competencia donde antes tenía exclusividad.\n- Próximo catalizador: Confirmación o desmentido oficial del rol de AMD en TPU v10; próximos resultados trimestrales de Broadcom.\n\nAMAT | Applied Materials | Sc.:74 | Tendencia: AI Compute/Data Center Buildout | Int.: +2 (HIGH)\n- Tesis: Expansión de capacidad de fabricación en TSMC (**TSM**) (Chiayi AP7, Nanya AP8) y gate-all-around en Intel/Samsung impulsan demanda de equipos de deposición y litografía.\n- Riesgo principal: Ciclicidad histórica del gasto de capex de fabs; exposición a controles de exportación a China.\n- Próximo catalizador: Guía de pedidos de equipo para 2027 en próximos resultados.\n\nLRCX | Lam Research | Sc.:73 | Tendencia: AI Compute/Data Center Buildout | Int.: +2 (HIGH)\n- Tesis: Beneficiario directo de la expansión de capacidad de etch/deposition ligada al ramp de 2nm/A16 y HBM en Corea y Taiwán.\n- Riesgo principal: Igual que AMAT, dependencia del ciclo de capex de memoria y lógica avanzada.\n- Próximo catalizador: Resultados trimestrales con detalle de pedidos por segmento (memoria vs. lógica).\n\nASML | ASML Holding | Sc.:72 | Tendencia: AI Compute/Data Center Buildout | Int.: +2 (HIGH)\n- Tesis: La aceleración del roadmap A16/2nm de TSMC (**TSM**) y el HBM4E de Samsung/SK hynix sostienen la demanda de EUV y High-NA EUV.\n- Riesgo principal: Concentración de clientes (TSMC (**TSM**), Samsung, Intel) y riesgo de que retrasos en calificación de High-NA pospongan ingresos.\n- Próximo catalizador: Pedidos de High-NA EUV reportados en próximos resultados.\n\nMRVL | Marvell Technology | Sc.:71 | Tendencia: AI Compute/Data Center Buildout | Int.: +2 (HIGH)\n- Tesis: Expuesta a interconexión óptica y silicio custom, ambos ejes reforzados por el salto de ancho de banda hacia CPO en el roadmap Feynman de Nvidia.\n- Riesgo principal: Competencia de Broadcom y potencialmente AMD en diseño custom; menor escala que sus pares.\n- Próximo catalizador: Anuncios de diseños custom con hyperscalers adicionales.\n\nCRSP | CRISPR Therapeutics | Sc.:75 | Tendencia: Edición Génica In Vivo / CRISPR Comercial | Int.: +2 (HIGH)\n- Tesis: Aprobación pediátrica de Casgevy (niños desde 2 años, +5,500 pacientes elegibles) junto con inicio de Fase 1 para CTX340 y CTX460 diversifica el pipeline más allá de hemoglobinopatías.\n- Riesgo principal: Ingresos por royalties de Casgevy dependen de la velocidad de infusión de pacientes vía Vertex; el pipeline in vivo aún está en etapas tempranas (Fase 1).\n- Próximo catalizador: Datos de CTX310 en el congreso ESC, 28-ago-2026.\n```\n\n## 5. Empresas con score provisional < 30 (BEARISH)\n\nSin novedades hoy. No se identificaron catalizadores materiales negativos que desplacen a alguna empresa del universo por debajo del umbral BEARISH en las últimas 48h. Esto es consistente con el patrón observado en sesiones previas (H2: el umbral de ≥2 catalizadores materiales filtra sistemáticamente señales negativas aisladas).\n\n## 6. Conflictos detectados\n\nSin novedades hoy. Ninguna tendencia analizada mostró una dispersión de scores entre analistas (técnico/económico/geopolítico/contrarian) superior a 50 puntos.\n\n## 7. Notas para revisión humana\n\n- El reporte de SemiAnalysis sobre la participación de AMD en el diseño de la próxima TPU de Google (v10) es \"market chatter\" no confirmado oficialmente por ninguna de las dos compañías; tratar el score de AVGO/AMD ligado a este evento con cautela hasta confirmación.\n- Samsung reveló que sus exportaciones de chips a China ($62.5bn) superaron a EE.UU. ($49.8bn) en H1 2026 por primera vez; la licencia de exportación anual para la planta Xi'an vence el 31-dic-2026 y su renovación no está garantizada. Esto es un riesgo geopolítico de cola gorda para toda la cadena de memoria HBM (relevante indirectamente para TSM, AMAT, LRCX) que debería monitorearse trimestre a trimestre aunque ningún ticker del universo esté directamente afectado hoy.\n- El hallazgo genético (alelo HLA C*05:01) vinculado a toxicidad hepática en el programa nex-z de Intellia podría tener implicaciones de clase para otras terapias de edición in vivo dirigidas al hígado (incluyendo programas futuros de CRSP/BEAM); vale la pena vigilar si CRISPR Therapeutics (**CRSP**) o Beam Therapeutics (**BEAM**) incorporan genotipado HLA en sus propios ensayos in vivo.\n- La tendencia de almacenamiquerto de baterías (batería + solar) mostró crecimiento fuerte (+70% anual en EE.UU.) pero también señales de estrés en interconexión de red (Bloomberg, 15-ago); no se asignó score BULLISH a ENPH/FSLR/TSLA porque el catalizador es mixto (crecimiento de mercado vs. cuello de botella de infraestructura) — revisar si en próximas sesiones el cuello de botella se convierte en un riesgo material para el guidance de estas compañías.\n\n---\n\n## Fase 5 — Tabla de scores para persistenciaSCORES_CSV_START\nTICKER,SCORE,SCENARIO,INTENSIDAD\nNVDA,90,BULLISH,3\nAMD,88,BULLISH,3\nTSM,87,BULLISH,3\nSMCI,86,BULLISH,3\nAVGO,78,BULLISH,2\nCRSP,75,BULLISH,2\nAMAT,74,BULLISH,2\nLRCX,73,BULLISH,2\nASML,72,BULLISH,2\nMRVL,71,BULLISH,2\nGOOGL,69,NEUTRAL,2\nGOOG,69,NEUTRAL,2\nINTC,68,NEUTRAL,1\nMSFT,66,NEUTRAL,1\nORCL,64,NEUTRAL,1\nIONQ,62,NEUTRAL,1\nTSLA,60,NEUTRAL,1\nRGTI,60,NEUTRAL,1\nENPH,58,NEUTRAL,1\nFSLR,56,NEUTRAL,1\nBEAM,52,NEUTRAL,0\nSCORES_CSV_END");

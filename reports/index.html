si no logra paridad de yield en 18A a tiempo.\n- **Qué vigilar:** Actualización de capex guidance de TSMC (**TSM**) en próximo earnings call; yield rates reportados en Fab 20.\n\n**OLIX Computing capta $312M en chips fotónicos de inferencia AI**\n- **Qué pasó:** Ronda Serie B a valuación $3.3B para chips de inferencia fotónica, dirigida a cuellos de botella de energía/refrigeración en AI compute. Fuente: semiconductorsinsight.com (2026-08).\n- **Por qué importa:** Señala que el capital de riesgo está rotando desde \"más GPUs\" hacia soluciones de eficiencia energética del data center, un cuello de botella cada vez más citado por hyperscalers.\n- **Implicación de inversión:** Indirectamente positivo para proveedores de infraestructura de data center con foco en eficiencia (MRVL vía interconexión óptica, AVGO custom XPU). Riesgo latente a largo plazo para modelos de negocio de GPU tradicional si la fotónica escala.\n- **Qué vigilar:** Anuncios de clientes/pilotos comerciales de OLIX en próximos 2 trimestres.\n\n**IBM CEO: quantum computing \"se acerca a breakthrough comercial\"**\n- **Qué pasó:** Declaraciones públicas del CEO de IBM ubicando contribución material a ingresos/beneficio para 2028-2029; paralelamente OptQC/NTT anuncian alianza para computador óptico de 1M qubits (prototipo 10k qubits para FY2028). Fuente: CoinDesk (2026-07-31).\n- **Por qué importa:** Refuerza narrativa de \"quantum advantage\" acercándose, aunque el horizonte de monetización real sigue siendo 2028+, fuera de la ventana de 18 meses del universo.\n- **Implicación de inversión:** Neutral/especulativo para IONQ, RGTI, IBM — el hype puede sostener múltiplos pero sin catalizador de ingresos cercano. Mantener exposición táctica, no estructural.\n- **Qué vigilar:** Guidance de ingresos quantum de IBM en próximo earnings; roadmap concreto de OptQC/NTT.\n\n**Intellia reporta datos positivos de fase avanzada para lonvo-z (angioedema hereditario)**\n- **Qué pasó:** Terapia CRISPR in vivo redujo ataques 87% vs placebo en 6 meses; camino hacia FDA. Fuente: BioSpace (2026-08).\n- **Por qué importa:** Es el primer \"win\" de fase tardía para un editor génico in vivo (no ex vivo como Casgevy), validando la plataforma de edición dentro del cuerpo, con menor complejidad logística que terapias celulares.\n- **Implicación de inversión:** Aunque Intellia no está en el universo curado, valida la tesis para CRSP y BEAM como plataformas comparables de gene editing. Positivo direccional moderado.\n- **Qué vigilar:** Sometimiento formal a FDA y fecha de PDUFA si se anuncia.\n\n**Stellantis/Factorial prueban en carretera celdas de estado sólido FEST**\n- **Qué pasó:** Celdas de 375 Wh/kg instaladas en prototipo Dodge Charger Daytona, carga 15-90% en 18 minutos, operación -30°C a 45°C. Fuente: Intelligent Living, BatteryTechOnline (2026-08).\n- **Por qué importa:** Es una prueba física real (no solo laboratorio) de una tecnología que consenso de industria ubica como no comercializable a escala hasta después de 2030.\n- **Implicación de inversión:** Marginalmente positivo para el ecosistema EV/battery a largo plazo, pero sin ticker directo en el universo actual (ni Stellantis ni Factorial están cubiertos). Efecto indirecto en TSLA vía competencia de rango/carga si la tecnología madura antes de lo esperado.\n- **Qué vigilar:** Anuncio de línea piloto gigawatt-hora de Factorial/Stellantis.\n\n## 3. Tendencias emergentes nuevas detectadas hoy\n\nSin tendencias genuinamente nuevas detectadas hoy — los desarrollos observados son continuaciones/aceleraciones de tendencias ya activas (2nm scaling, eficiencia energética AI, gene editing in vivo, solid-state batteries, quantum roadmap). No se identifica ningún catalizador de categoría nueva en las últimas 48h.\n\n## 4. Empresas con score provisional > 70 (BULLISH)\n\n```\nTSM | TSMC | Sc.:83 | Tendencia: Semiconductores 2nm | Int.: +3 (CORE)\n- Tesis: Producción en volumen de 2nm con capacidad 2026 100% reservada por Apple, Qualcomm, MediaTek, AMD y NVIDIA; único fabricante avanzado en ejecución real, no en roadmap.\n- Riesgo principal: Concentración geográfica en Taiwán mantiene riesgo geopolítico estructural no resuelto por el catalizador técnico.\n- Próximo catalizador: Próximo earnings call con actualización de capex guidance y yield de Fab 20.\n```\n\n```\nASML | ASML Holding | Sc.:76 | Tendencia: Semiconductores 2nm | Int.: +2 (HIGH)\n- Tesis: Colaboración con TSMC (**TSM**)/Imec en materiales 2D posiciona a ASML como proveedor de equipo crítico para el siguiente salto post-2nm, extendiendo la vida útil de su franquicia EUV/High-NA.\n- Riesgo principal: Ciclo de capex de clientes puede diferirse si demanda de IA se modera, afectando pedidos de litografía de próxima generación.\n- Próximo catalizador: Detalles técnicos/timeline del acuerdo ASML-Imec-TSMC (**TSM**) en Taiwán.\n```\n\n## 5. Empresas con score provisional < 30 (BEARISH)\n\nSin novedades hoy — ningún desarrollo de las últimas 48h generó al menos 2 catalizadores materiales negativos para una empresa específica del universo. No se fuerza inclusión de BEARISH para cumplir cuota.\n\n## 6. Conflictos detectados\n\nSin novedades hoy. Ninguna tendencia analizada presentó dispersión de scores entre analistas superior a 50 puntos.\n\n## 7. Notas para revisión humana\n\n- El catalizador de baterías de estado sólido (Stellantis/Factorial) no tiene ticker directo en el universo de 51 empresas curadas — considerar si TSLA merece intensidad EXPOSED/THREATENED por competencia de próxima generación, o si se debe ampliar el universo con proveedores de battery tech.\n- El comentario del CEO de IBM sobre quantum (\"breakthrough\" hacia 2028-2029) queda fuera de la ventana de predicción de 3-18 meses del sistema — se registra como contexto pero no genera score BULLISH por no cumplir el criterio de catalizador con impacto en horizonte.\n- Solo 2 empresas superaron el umbral BULLISH (>70) hoy; el resto del universo permanece en zona NEUTRAL por falta
